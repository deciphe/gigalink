<style>
*{box-sizing:border-box}html{background:#060607}body{margin:0;min-height:100svh;color:#eeeae3;font-family:Manrope,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.scene{position:relative;isolation:isolate;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:90px 6vw;background:radial-gradient(ellipse at 72% 16%,#73618e18,transparent 46%),radial-gradient(ellipse at 21% 86%,#a0834910,transparent 42%),#060607;overflow:hidden}
.sky{position:absolute;inset:0;z-index:-3;opacity:.7;background-image:radial-gradient(circle at 14% 18%,#e9decb 0 .7px,transparent 1.4px),radial-gradient(circle at 79% 23%,#b1a0cf 0 1px,transparent 1.7px),radial-gradient(circle at 91% 68%,#d5c09a 0 .6px,transparent 1.5px),radial-gradient(circle at 31% 79%,#d5c09a 0 .7px,transparent 1.4px),radial-gradient(circle at 62% 8%,#d6c7e1 0 .6px,transparent 1.3px)}

.aura{position:absolute;z-index:-1;left:17%;right:17%;height:45%;top:26%;background:radial-gradient(ellipse at 28% 65%,#c4a36729,transparent 57%),radial-gradient(ellipse at 80% 35%,#9f7fc633,transparent 60%);filter:blur(65px);animation:breathe 8s ease-in-out infinite alternate}
.topline,.bottomline{position:absolute;left:6vw;right:6vw;display:flex;align-items:center;justify-content:space-between;gap:20px;font-size:10px;font-weight:800;letter-spacing:2px;color:#878189;text-transform:uppercase}.topline{top:32px}.bottomline{bottom:27px;font-size:8px;letter-spacing:1.7px;color:#625c65}.brand{color:#e7e1d7;font-size:17px;letter-spacing:-.8px}.status{display:flex;gap:9px;align-items:center}.status:before{content:"";width:4px;height:4px;border-radius:50%;background:#d2bd8b;box-shadow:0 0 13px #d2bd8b80}
.card{position:relative;width:min(1280px,100%);margin:auto;padding:clamp(45px,7vw,95px) clamp(20px,4vw,58px) 38px;text-align:center;border:1px solid #e3d4bd25;border-radius:22px;background:linear-gradient(125deg,#ffffff09,#0b0a0ee8 33%,#0d0c11d9 68%,#c4ac7809);box-shadow:inset 0 1px #ffffff0b,inset 0 -1px #000,0 50px 130px #000b,0 0 85px #ac8cc00b;backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px)}

.kicker{margin:0 0 34px;font-size:11px;line-height:1.6;font-weight:800;letter-spacing:3px;color:#b5a58b}
h1{margin:0;font-size:clamp(55px,12.7vw,182px);font-weight:800;line-height:.91;letter-spacing:-.085em;white-space:nowrap;background:linear-gradient(115deg,#f9f5ec 12%,#ded8d0 43%,#b2aab7 76%,#eadfcb);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px #dbcde212);padding-right:.08em}
.statement{margin:26px 0 0;font-size:clamp(21px,3.1vw,42px);line-height:1.15;font-weight:800;letter-spacing:-1.4px;color:#e8e2da}.statement em{font-style:normal;color:#96909c}
.enter{position:relative;display:inline-flex;align-items:center;justify-content:space-between;gap:60px;min-width:260px;margin:39px 0 0;padding:19px 25px;border:1px solid #d0b58155;border-radius:7px;color:#eee7d9;text-decoration:none;font-size:13px;font-weight:800;letter-spacing:.2px;background:radial-gradient(ellipse at 100% 0,#a483c524,transparent 70%),linear-gradient(115deg,#302b3080,#151217 60%,#30291e88);box-shadow:inset 0 1px #ffffff08,0 0 24px #b293ce12,0 0 45px #bda0710b;transition:transform .2s,border-color .2s,box-shadow .2s}
.enter span{font-size:22px;font-weight:600;line-height:1;color:#c9bfae}.enter:hover{transform:translateY(-2px);border-color:#dcc492aa;box-shadow:0 0 38px #b293ce20}.enter:focus-visible{outline:2px solid #d7c294;outline-offset:6px}
.transfer{margin:23px 0 0;color:#77717d;font-size:10px;font-weight:700;letter-spacing:.5px}.rail{width:100px;height:1px;margin:15px auto 0;background:#ffffff12;overflow:hidden}.rail:after{content:"";display:block;height:100%;background:linear-gradient(90deg,#a390bf,#d8c294);transform-origin:left;animation:progress 5s linear both;box-shadow:0 0 10px #d8c29477}
.card-foot{display:flex;justify-content:space-between;gap:12px;margin-top:55px;padding-top:19px;border-top:1px solid #ffffff09;color:#827986;font-size:8px;font-weight:800;letter-spacing:2px;text-align:left}.card-foot span:last-child{color:#a99c88;text-align:right}
@keyframes breathe{to{opacity:.55;transform:scale(1.12)}}@keyframes progress{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media(max-width:600px){.scene{padding:80px 16px}.topline,.bottomline{left:23px;right:23px}.topline{top:25px;font-size:8px;letter-spacing:1px}.brand{font-size:15px}.bottomline{font-size:7px;letter-spacing:1px}.card{padding:57px 15px 23px;border-radius:15px}.kicker{font-size:8px;letter-spacing:2px;margin-bottom:31px}h1{font-size:14.5vw}.statement{font-size:26px;letter-spacing:-1px;margin-top:22px}.enter{min-width:235px;margin-top:33px;padding:17px 20px}.card-foot{font-size:6px;letter-spacing:1px;margin-top:44px}.halo{width:135vw;height:135vw}.aura{left:-10%;right:-10%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
